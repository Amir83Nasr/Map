<!doctype html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="layout">
        <main class="map-wrap">
          <div id="map"></div>
          <div id="centerPin" class="center-pin" aria-hidden="true">
            <div class="pin-body">
              <div class="pin-head"><div class="pin-hole"></div></div>
              <div class="pin-stem"></div>
              <div class="pin-foot"></div>
            </div>
            <div class="pin-shadow"></div>
          </div>
          <button id="gpsBtn" class="gps" aria-label="موقعیت فعلی">
            <i data-lucide="locate-fixed"></i>
          </button>
        </main>

        <section class="sheet" aria-live="polite">
          <div class="grab" aria-hidden="true"></div>
          <div class="search">
            <button id="searchOpen" class="search-trigger" type="button">
              <span class="search-ic" aria-hidden="true"
                ><i data-lucide="search"></i
              ></span>
              <span id="searchLabel" class="search-label"
                >جستجوی آدرس یا مکان</span
              >
            </button>
          </div>
          <div class="sheet-row">
            <button id="confirm" class="cta">تایید مبدا</button>
          </div>
        </section>
      </div>

      <div
        id="searchOverlay"
        class="search-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="جستجو"
        hidden
      >
        <div class="search-top">
          <button id="searchBack" class="search-back" aria-label="بستن جستجو">
            <i data-lucide="arrow-right"></i>
          </button>
          <div class="search-field">
            <input
              id="searchInput"
              type="search"
              placeholder="جستجوی آدرس یا مکان"
              autocomplete="off"
              aria-label="جستجو"
            />
            <span class="search-ic" aria-hidden="true"
              ><i data-lucide="search"></i
            ></span>
          </div>
        </div>
        <div id="results" class="results-full"></div>
      </div>

      <div
        id="permModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="permTitle"
      >
        <div class="modal-card">
          <button id="permClose" class="modal-close" aria-label="بستن">
            <i data-lucide="x"></i>
          </button>
          <h2 id="permTitle">دسترسی به موقعیت مکانی</h2>
          <p class="modal-text">
            برای انتخاب موقعیت فعلی شما، لازم است دسترسی موقعیت مکانی را فعال
            کنید.
          </p>
          <p id="permHint" class="modal-sub hidden">
            مرورگر قبلاً دسترسی را بسته است. جاوااسکریپت نمی‌تواند این محدودیت
            را دور بزند؛ از تنظیمات سایت مرورگر، دسترسی Location را مجاز کنید.
          </p>
          <div class="modal-row">
            <button id="permRetry" class="cta">
              <i data-lucide="locate-fixed"></i>فعال کردن دسترسی
            </button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast" role="status"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
  </body>
</html>
