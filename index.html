<!doctype html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>انتخاب مبدأ</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="layout">
        <main class="map-wrap">
          <div id="map"></div>
          <div id="centerPin" class="center-pin" aria-hidden="true">
            <svg viewBox="0 0 40 56" width="40" height="56" aria-hidden="true">
              <path
                d="M20 54 C20 54 4 31 4 17.5 A16 16 0 1 1 36 17.5 C36 31 20 54 20 54Z"
                fill="#2F6BFF"
              />
              <circle cx="20" cy="17.5" r="6.5" fill="#fff" />
            </svg>
          </div>
          <button id="gpsBtn" class="gps" aria-label="موقعیت فعلی">
            <i data-lucide="locate-fixed"></i>
          </button>
        </main>

        <section class="sheet" aria-live="polite">
          <div class="grab" aria-hidden="true"></div>
          <div id="searchBar" class="search">
            <div class="search-field">
              <input
                id="searchInput"
                type="search"
                placeholder="جستجوی آدرس یا مکان"
                autocomplete="off"
                aria-label="جستجو"
              />
              <span class="search-ic" aria-hidden="true"
                ><i data-lucide="search"></i
              ></span>
            </div>
            <div id="results" class="results" hidden></div>
          </div>
          <div class="sheet-row">
            <button id="confirm" class="cta">تایید مبدا</button>
          </div>
        </section>
      </div>

      <div
        id="permModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="permTitle"
      >
        <div class="modal-card">
          <button id="permClose" class="modal-close" aria-label="بستن">
            <i data-lucide="x"></i>
          </button>
          <h2 id="permTitle">دسترسی به موقعیت مکانی</h2>
          <p class="modal-text">
            برای انتخاب موقعیت فعلی شما، لازم است دسترسی موقعیت مکانی را فعال
            کنید.
          </p>
          <p id="permHint" class="modal-sub hidden">
            مرورگر قبلاً دسترسی را بسته است. جاوااسکریپت نمی‌تواند این محدودیت
            را دور بزند؛ از تنظیمات سایت مرورگر، دسترسی Location را مجاز کنید.
          </p>
          <div class="modal-row">
            <button id="permRetry" class="cta">
              <i data-lucide="locate-fixed"></i>فعال کردن دسترسی
            </button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast" role="status"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
  </body>
</html>
