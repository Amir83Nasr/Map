<!doctype html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="preconnect"
      href="https://a.basemaps.cartocdn.com"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://b.basemaps.cartocdn.com"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="layout">
        <main class="map-wrap">
          <div id="map"></div>
          <div id="centerPin" class="center-pin" aria-hidden="true">
            <div class="pin-body">
              <div class="pin-head"><div class="pin-hole"></div></div>
              <div class="pin-stem"></div>
              <div class="pin-foot"></div>
            </div>
            <div class="pin-shadow"></div>
          </div>
          <button id="gpsBtn" class="gps" aria-label="موقعیت فعلی">
            <i data-lucide="locate-fixed"></i>
          </button>
        </main>

        <section class="sheet" aria-live="polite">
          <div class="grab" aria-hidden="true"></div>
          <div class="search">
            <button id="searchOpen" class="search-trigger" type="button">
              <span class="search-ic" aria-hidden="true"
                ><i data-lucide="search"></i
              ></span>
              <span id="searchLabel" class="search-label"
                >جستجوی آدرس یا مکان</span
              >
            </button>
          </div>
          <div class="sheet-row">
            <button id="confirm" class="cta">تایید موقعیت</button>
          </div>
        </section>
      </div>

      <div
        id="searchOverlay"
        class="search-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="جستجو"
        hidden
      >
        <div class="ov-head">
          <h2>مبدأ</h2>
          <button id="searchBack" class="ov-close" aria-label="بستن جستجو">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="search-bar">
          <button id="cityBtn" class="city-btn" type="button">
            شهر فعلی<i data-lucide="chevron-down"></i>
          </button>
          <span class="vdiv" aria-hidden="true"></span>
          <div class="search-field">
            <input
              id="searchInput"
              type="search"
              placeholder="جست‌وجوی مبدأ..."
              autocomplete="off"
              aria-label="جستجو"
            />
          </div>
          <button id="micBtn" class="mic-btn" type="button" aria-label="جست‌وجوی صوتی">
            <i data-lucide="mic"></i>
          </button>
        </div>
        <div class="ov-body">
          <div id="homeContent">
            <div class="fav-row">
              <button class="fav-chip" type="button" data-q="خانه">
                <span class="fav-star"><i data-lucide="star"></i></span>خانه
              </button>
              <button class="fav-chip" type="button" data-q="مدرسه">
                <span class="fav-star"><i data-lucide="star"></i></span>مدرسه
              </button>
              <button class="fav-chip" type="button" data-q="مامان بزرگ">
                <span class="fav-star"><i data-lucide="star"></i></span>مامان بزرگ
              </button>
            </div>
            <h3 class="sec-t">جست‌وجوهای اخیر</h3>
            <div id="recentList"></div>
            <h3 class="sec-t">مکان‌های پیشنهادی</h3>
            <div id="suggestList"></div>
          </div>
          <div id="results" class="results-list"></div>
        </div>
      </div>

      <div
        id="permModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="permTitle"
      >
        <div class="modal-card">
          <button id="permClose" class="modal-close" aria-label="بستن">
            <i data-lucide="x"></i>
          </button>
          <h2 id="permTitle">دسترسی به موقعیت مکانی</h2>
          <p class="modal-text">
            برای انتخاب موقعیت فعلی شما، لازم است دسترسی موقعیت مکانی را فعال
            کنید.
          </p>
          <p id="permHint" class="modal-sub hidden">
            مرورگر قبلاً دسترسی را بسته است. جاوااسکریپت نمی‌تواند این محدودیت
            را دور بزند؛ از تنظیمات سایت مرورگر، دسترسی Location را مجاز کنید.
          </p>
          <div class="modal-row">
            <button id="permRetry" class="cta">
              <i data-lucide="locate-fixed"></i>فعال کردن دسترسی
            </button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast" role="status"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
  </body>
</html>
